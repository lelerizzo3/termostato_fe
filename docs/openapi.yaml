openapi: 3.0.3
info:
  title: Termostato API
  description: |
    Contratto REST inbound del backend del termostato intelligente.

    Tutti gli endpoint richiedono l'header `X-API-Key`. La chiave viene
    confrontata con l'elenco `api_keys` della configurazione. Una chiave
    mancante o non valida produce `401 Unauthorized`.

    I nomi JSON seguono la strategia `SNAKE_CASE` configurata nel backend.
    Le date e i timestamp sono espressi in UTC.
    Le ore degli intervalli del calendario sono invece interpretate nel
    `fuso_orario` configurato, con regole DST controllate da `ora_legale`.

    Gli endpoint `/shelly/*` sono sempre attivi indipendentemente dal profilo
    Spring. Con il profilo `mock` vengono simulati solo il sensore di
    temperatura/umidità e il relay del termostato (che puntano a
    `localhost:8080`); i dispositivi Shelly continuano a essere interrogati
    ai loro IP reali.

    La lettura dello stato dei dispositivi Shelly è centralizzata in
    `GET /shelly/stato/{id}`: ogni chiamata interroga il dispositivo in tempo
    reale e restituisce il relè (se presente) e le misure elettriche (se
    presenti). Non esiste uno storico delle misure lato backend.

    Le risposte ai comandi `POST /shelly/relay/{id}/on|off` includono i campi
    `esito` (conferma esplicita dell'esecuzione del comando da parte del
    dispositivo) e `stato_precedente` (stato del relay prima del comando, per
    i device Gen 3; `null` per i Gen 1). Su `GET /shelly/relay/{id}` entrambi
    i campi sono `null`.

    Gli endpoint `/temperature`, `/relay` e `/mock/*` sono disponibili solo
    quando è attivo il profilo Spring `mock`; simulano il sensore e il relay
    per lo scenario E2E. Il client ntfy e gli endpoint configurati per i
    dispositivi fisici sono integrazioni outbound e non fanno parte di questa
    specifica inbound.
  version: 1.6.0
  contact:
    name: Team Termostato
servers:
  - url: http://localhost:8080
    description: Istanza locale predefinita (la porta può essere sovrascritta)

security:
  - ApiKeyAuth: []

tags:
  - name: Configurazione
    description: Configurazione runtime e calendario settimanale
  - name: Log
    description: Log dei cicli di polling e degli errori
  - name: Stato
    description: Stato corrente letto da sensore, configurazione e relay
  - name: Shelly
    description: |
      Dispositivi Shelly — relay, power monitor e relè con power meter
      (Shelly 1PM, tipo `PM_RELAY`). Sempre attivi indipendentemente dal profilo
      Spring; con il profilo `mock` i device Shelly continuano a essere
      interrogati ai loro IP reali nella rete locale. Lo stato è letto in tempo
      reale dal dispositivo e non viene persistito.
  - name: Actuator
    description: Endpoint operativi Spring Boot Actuator
  - name: Mock
    description: Endpoint disponibili solo con `termostato.mock-devices.enabled=true`

paths:
  /config:
    get:
      tags: [Configurazione]
      summary: Legge la configurazione corrente
      description: Restituisce la configurazione runtime attualmente applicata.
      operationId: getConfiguration
      responses:
        '200':
          description: Configurazione corrente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfiguration'
              example:
                soglia_attivazione: 0.3
                override_attivo: false
                temperatura_override: null
                override_fine: null
                intervallo_polling_secondi: 60
                max_errori_consecutivi: 3
                retention_log_giorni: 30
                ntfy_url: https://ntfy.sh
                ntfy_topic: sliverd
                debug_mode: false
                fuso_orario: Europe/Rome
                ora_legale: true
                notifiche_errori_abilitate: true
                meteo_esterno_url: https://api.open-meteo.com
                meteo_esterno_latitudine: 37.6167
                meteo_esterno_longitudine: 15.1667
                sensore_url: http://sensore.local
                relay_url: http://relay.local
                database_path: ./data/termostato.db
                api_keys:
                  - sostituire-con-una-chiave-segreta
                alert_soglia: 0
                alert_polling: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Configurazione]
      summary: Aggiorna la configurazione corrente
      description: |
        Sostituisce la configurazione runtime e la persiste nel file JSON.
        L'aggiornamento è immediato e non richiede il riavvio.

        Il campo `database_path` è bootstrap-only e deve rimanere invariato
        rispetto al valore usato all'avvio. La richiesta deve contenere una
        chiave attualmente autorizzata; non è possibile usare questa operazione
        per aggiungere la prima chiave quando `api_keys` è vuoto.

        Se `override_attivo` è true e `override_fine` è valorizzato, deve essere
        un istante futuro rispetto all'ora corrente (orario civile locale):
        un valore già trascorso viene rifiutato con `400`.

        L'operazione è una sostituzione completa: i campi assenti dal payload
        vengono azzerati senza errore. In particolare `alert_soglia` e
        `alert_polling` devono essere **sempre** reinviati, altrimenti l'alert di
        consumo viene silenziosamente disattivato. `alert_polling` deve essere un
        intero: una parte decimale viene troncata, non rifiutata. I valori negativi
        di entrambi i campi sono rifiutati con `400`.
      operationId: updateConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfiguration'
            example:
              soglia_attivazione: 0.3
              override_attivo: true
              temperatura_override: 20.5
              override_fine: '2026-09-13T08:00:00'
              intervallo_polling_secondi: 60
              max_errori_consecutivi: 3
              retention_log_giorni: 30
              ntfy_url: https://ntfy.sh
              ntfy_topic: sliverd
              debug_mode: false
              fuso_orario: Europe/Rome
              ora_legale: true
              notifiche_errori_abilitate: true
              meteo_esterno_url: https://api.open-meteo.com
              meteo_esterno_latitudine: 37.6167
              meteo_esterno_longitudine: 15.1667
              sensore_url: http://sensore.local
              relay_url: http://relay.local
              database_path: ./data/termostato.db
              api_keys:
                - sostituire-con-una-chiave-segreta
              alert_soglia: 1500.75
              alert_polling: 30
      responses:
        '200':
          description: Configurazione aggiornata e persistita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /config/calendario:
    get:
      tags: [Configurazione]
      summary: Legge il calendario settimanale
      description: Restituisce i sette giorni del calendario con gli intervalli configurati.
      operationId: getCalendar
      responses:
        '200':
          description: Calendario corrente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDocument'
              example:
                giorni:
                  lunedi: []
                  martedi: []
                  mercoledi: []
                  giovedi:
                    - ora_inizio: '06:00'
                      ora_fine: '08:00'
                      temperatura_target: 20.5
                  venerdi: []
                  sabato: []
                  domenica: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Configurazione]
      summary: Aggiorna il calendario settimanale
      description: |
        Sostituisce e persiste il calendario. Il payload deve contenere
        esattamente i sette giorni canonici. Gli intervalli dello stesso giorno
        non possono sovrapporsi e `ora_inizio` deve precedere `ora_fine`.
        Gli orari sono interpretati nel `fuso_orario` configurato; quando
        `ora_legale` è true vengono applicate automaticamente le regole CET/CEST.
        La fine dell'intervallo è esclusa.
      operationId: updateCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarDocument'
            example:
              giorni:
                lunedi: []
                martedi: []
                mercoledi: []
                giovedi:
                  - ora_inizio: '06:00'
                    ora_fine: '08:00'
                    temperatura_target: 20.5
                venerdi: []
                sabato: []
                domenica: []
      responses:
        '200':
          description: Calendario aggiornato e persistito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /log:
    get:
      tags: [Log]
      summary: Legge il log dei cicli di polling
      description: |
        Restituisce i record ordinati per timestamp crescente. Senza parametri
        viene usato il giorno corrente in UTC. `da` e `a` sono inclusivi a
        livello di data: il range effettivo è `[da 00:00:00Z, a + 1 giorno
        00:00:00Z)`.
      operationId: getPollingLogs
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Record del log di polling
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PollingLogRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /log/errori:
    get:
      tags: [Log]
      summary: Legge il log degli errori
      description: |
        Restituisce gli errori ordinati per timestamp crescente. I parametri
        hanno la stessa semantica di `GET /log` e sono interpretati in UTC.
      operationId: getErrorLogs
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Record del log degli errori
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErrorLogRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /stato:
    get:
      tags: [Stato]
      summary: Legge lo stato corrente del termostato
      description: |
        Legge in tempo reale temperatura e umidità dal sensore interno,
        lo stato dal relay e temperatura/umidità esterne da Open-Meteo.
        `temperatura_target` è il target risolto dalla configurazione al momento
        della richiesta: override se attivo, altrimenti intervallo calendario
        corrente nel `fuso_orario` configurato, con eventuale ora legale.
        È `null` quando non esiste alcun target attivo.
      operationId: getCurrentState
      responses:
        '200':
          description: Stato corrente del termostato
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - temperatura
                  - umidita
                  - temperatura_target
                  - relay_acceso
                  - temperatura_esterna
                  - umidita_esterna
                properties:
                  temperatura:
                    type: number
                    format: double
                    description: Temperatura interna rilevata dal sensore in °C.
                    example: 19.0
                  umidita:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 100
                    description: Umidità relativa interna in percentuale, a una cifra decimale.
                    example: 50.0
                  temperatura_target:
                    type: number
                    format: double
                    nullable: true
                    description: Target configurato e attivo in °C; null senza target.
                    example: 20.5
                  relay_acceso:
                    type: boolean
                    description: Stato letto direttamente dal relay.
                    example: false
                  temperatura_esterna:
                    type: number
                    format: double
                    nullable: true
                    description: Temperatura esterna corrente da Open-Meteo in °C.
                    example: 24.3
                  umidita_esterna:
                    type: number
                    format: double
                    nullable: true
                    minimum: 0
                    maximum: 100
                    description: Umidità relativa esterna da Open-Meteo in percentuale.
                    example: 68.6
              example:
                temperatura: 19.0
                umidita: 50.0
                temperatura_target: 20.5
                relay_acceso: false
                temperatura_esterna: 24.3
                umidita_esterna: 68.6
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /actuator/health:
    get:
      tags: [Actuator]
      summary: Verifica lo stato applicativo
      description: Endpoint Spring Boot Actuator esposto dalla configurazione applicativa.
      operationId: getHealth
      responses:
        '200':
          description: Stato applicativo disponibile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActuatorHealth'
              example:
                status: UP
        '401':
          $ref: '#/components/responses/Unauthorized'

  /actuator/info:
    get:
      tags: [Actuator]
      summary: Legge le informazioni applicative
      description: Endpoint Spring Boot Actuator `info`, esposto ma senza dettagli custom obbligatori.
      operationId: getActuatorInfo
      responses:
        '200':
          description: Informazioni applicative; può essere un oggetto vuoto
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /actuator/metrics:
    get:
      tags: [Actuator]
      summary: Elenca i nomi delle metriche
      operationId: listMetrics
      responses:
        '200':
          description: Nomi delle metriche disponibili
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActuatorMetricNames'
              example:
                names:
                  - jvm.memory.used
                  - process.uptime
        '401':
          $ref: '#/components/responses/Unauthorized'

  /actuator/metrics/{requiredMetricName}:
    get:
      tags: [Actuator]
      summary: Legge una metrica
      operationId: getMetric
      parameters:
        - name: requiredMetricName
          in: path
          required: true
          description: Nome della metrica restituito da `GET /actuator/metrics`.
          schema:
            type: string
          example: process.uptime
      responses:
        '200':
          description: Valore e misurazioni della metrica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActuatorMetric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Metrica inesistente
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /shelly/dispositivi:
    get:
      tags: [Shelly]
      summary: Lista di tutti i dispositivi Shelly configurati
      description: |
        Restituisce la lista completa dei dispositivi con i loro metadati
        (id, nome, ip, tipo, modello, generazione). Utile al frontend per
        costruire la UI dinamicamente senza hardcodare gli id.
        I dispositivi sono letti dal file `shelly.json` al primo avvio.
      operationId: getShellyDispositivi
      responses:
        '200':
          description: Lista dispositivi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShellyDeviceResponse'
              example:
                - id: portone
                  nome: Portone
                  ip: 192.168.1.2
                  tipo: RELAY
                  modello: SHSW-1
                  generazione: 1
                - id: frigo-e-forno
                  nome: Frigo e Forno
                  ip: 192.168.1.9
                  tipo: PM
                  modello: SNPM-001PCEU16
                  generazione: 3
                - id: shelly1pm
                  nome: Shelly 1PM
                  ip: 192.168.1.20
                  tipo: PM_RELAY
                  modello: SHSW-PM
                  generazione: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /shelly/relay/{id}:
    get:
      tags: [Shelly]
      summary: Legge lo stato corrente di un relay Shelly
      description: |
        Interroga in tempo reale il dispositivo fisico e restituisce lo stato
        con i metadati del device. Il dispositivo deve essere di tipo `RELAY` o
        `PM_RELAY`. Per uno stato completo (relè più misure elettriche)
        usare `GET /shelly/stato/{id}`.
      operationId: getShellyRelayStato
      parameters:
        - $ref: '#/components/parameters/ShellyDeviceId'
      responses:
        '200':
          description: Stato del relay con metadati dispositivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShellyRelayStatoResponse'
              example:
                id: portone
                nome: Portone
                ip: 192.168.1.2
                modello: SHSW-1
                generazione: 1
                tipo: RELAY
                acceso: false
                esito: null
                stato_precedente: null
        '400':
          description: Il dispositivo esiste ma è di tipo PM, non RELAY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /shelly/relay/{id}/on:
    post:
      tags: [Shelly]
      summary: Accende il relay di un dispositivo Shelly
      description: |
        Invia il comando di accensione al dispositivo fisico, poi rilegge lo
        stato e lo restituisce insieme all'esito esplicito del comando
        (`esito`) e allo stato precedente (`stato_precedente`). Il dispositivo
        deve essere di tipo `RELAY` o `PM_RELAY`; per i `PM` la risposta è `400`.

        Nota: i dispositivi Portone e Cancello sono configurati con
        autospegnimento hardware dopo 1 secondo. Il backend non gestisce
        questa logica; lo stato restituito è quello immediatamente successivo
        al comando. Non usare `acceso` per valutare l'esito: verifica `esito`.
      operationId: accendiShellyRelay
      parameters:
        - $ref: '#/components/parameters/ShellyDeviceId'
      responses:
        '200':
          description: Stato aggiornato del relay con metadati dispositivo ed esito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShellyRelayStatoResponse'
              example:
                id: terrazzo
                nome: Terrazzo
                ip: 192.168.1.10
                modello: S3SW-001X8EU
                generazione: 3
                tipo: RELAY
                acceso: true
                esito: true
                stato_precedente: false
        '400':
          description: Il dispositivo esiste ma è di tipo PM, non RELAY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /shelly/relay/{id}/off:
    post:
      tags: [Shelly]
      summary: Spegne il relay di un dispositivo Shelly
      description: |
        Invia il comando di spegnimento al dispositivo fisico, poi rilegge lo
        stato e lo restituisce insieme all'esito esplicito del comando
        (`esito`) e allo stato precedente (`stato_precedente`). Il dispositivo
        deve essere di tipo `RELAY` o `PM_RELAY`; per i `PM` la risposta è `400`.
      operationId: spegniShellyRelay
      parameters:
        - $ref: '#/components/parameters/ShellyDeviceId'
      responses:
        '200':
          description: Stato aggiornato del relay con metadati dispositivo ed esito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShellyRelayStatoResponse'
              example:
                id: terrazzo
                nome: Terrazzo
                ip: 192.168.1.10
                modello: S3SW-001X8EU
                generazione: 3
                tipo: RELAY
                acceso: false
                esito: true
                stato_precedente: true
        '400':
          description: Il dispositivo esiste ma è di tipo PM, non RELAY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /shelly/stato/{id}:
    get:
      tags: [Shelly]
      summary: Legge in tempo reale lo stato completo di un dispositivo Shelly
      description: |
        Interroga il dispositivo fisico e restituisce lo stato completo: il
        relè se il tipo ne è dotato, le misure elettriche se il tipo ne è dotato,
        entrambe per gli Shelly 1PM (`PM_RELAY`). Non esiste persistenza: ogni
        chiamata legge il dispositivo, quindi l'aggiornamento periodico è
        responsabilità del client.

        I campi sono sempre presenti; quelli non applicabili al tipo valgono
        `null` (`acceso` per `PM`, `potenza_w`/`tensione_v`/`corrente_a` per
        `RELAY`). I valori misurati sono `null` anche quando il dispositivo ha
        restituito una lettura non interpretabile: non vanno resi come `0`.
      operationId: getShellyStato
      parameters:
        - $ref: '#/components/parameters/ShellyDeviceId'
      responses:
        '200':
          description: Stato del dispositivo con metadati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShellyStatoResponse'
              example:
                id: shelly1pm
                nome: Shelly 1PM
                ip: 192.168.1.20
                modello: SHSW-PM
                generazione: 1
                tipo: PM_RELAY
                acceso: true
                potenza_w: 45.2
                tensione_v: 229.8
                corrente_a: 0.197
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /temperature:
    get:
      tags: [Mock]
      summary: Legge la temperatura simulata
      description: |
        Disponibile solo con il profilo `mock`. È il contratto usato dal client
        interno del sensore; in produzione questo endpoint è sostituito dall'URL
        del dispositivo configurato in `sensore_url`.
      operationId: getMockTemperature
      responses:
        '200':
          description: Temperatura corrente del sensore simulato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemperatureReading'
              example:
                temperatura: 19.0
                umidita: 50.0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Profilo mock non attivo

  /relay:
    get:
      tags: [Mock]
      summary: Legge lo stato del relay simulato
      description: Disponibile solo con il profilo `mock`.
      operationId: getMockRelayState
      responses:
        '200':
          description: Stato corrente del relay simulato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayStateResponse'
              example:
                acceso: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Profilo mock non attivo
    post:
      tags: [Mock]
      summary: Invia un comando al relay simulato
      description: Disponibile solo con il profilo `mock`; aggiorna lo stato mantenuto dal dispositivo simulato.
      operationId: commandMockRelay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayCommand'
            examples:
              accensione:
                value:
                  acceso: true
              spegnimento:
                value:
                  acceso: false
      responses:
        '204':
          description: Comando applicato; nessun body nella risposta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Profilo mock non attivo

  /mock/temperature:
    put:
      tags: [Mock]
      summary: Imposta temperatura e umidità simulate
      description: Disponibile solo con il profilo `mock`; endpoint di controllo dello scenario E2E.
      operationId: setMockTemperature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemperatureReading'
            example:
              temperatura: 21.0
              umidita: 50.0
      responses:
        '200':
          description: Nuova lettura del sensore simulato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemperatureReading'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Profilo mock non attivo

  /mock/state:
    get:
      tags: [Mock]
      summary: Legge lo stato completo del dispositivo simulato
      description: Disponibile solo con il profilo `mock`; utile per le asserzioni E2E.
      operationId: getMockState
      responses:
        '200':
          description: Temperatura e stato relay simulati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockStateResponse'
              example:
                temperatura: 19.0
                umidita: 50.0
                relay_acceso: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Profilo mock non attivo

  /mock/reset:
    post:
      tags: [Mock]
      summary: Ripristina lo stato iniziale del mock
      description: Disponibile solo con il profilo `mock`; ripristina temperatura e relay dai valori di configurazione del mock.
      operationId: resetMockState
      responses:
        '200':
          description: Stato mock ripristinato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockStateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Profilo mock non attivo

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API-key autorizzata nella configurazione `api_keys`.

  parameters:
    FromDate:
      name: da
      in: query
      required: false
      description: 'Data iniziale inclusiva in UTC. Default: giorno corrente UTC, oppure il valore di `a` se `da` è assente.'
      schema:
        type: string
        format: date
      example: '2026-09-01'
    ToDate:
      name: a
      in: query
      required: false
      description: 'Data finale inclusiva in UTC. Default: giorno corrente UTC.'
      schema:
        type: string
        format: date
      example: '2026-09-04'
    ShellyDeviceId:
      name: id
      in: path
      required: true
      description: Identificatore del dispositivo Shelly (es. `portone`, `frigo-e-forno`).
      schema:
        type: string
      example: portone

  responses:
    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            timestamp: '2026-09-20T17:00:00Z'
            status: 404
            error: Not Found
            message: 'Dispositivo Shelly non trovato: inesistente'
    Unauthorized:
      description: API-key assente, vuota o non autorizzata
      headers:
        WWW-Authenticate:
          description: Schema di autenticazione richiesto dal backend
          schema:
            type: string
            example: ApiKey
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
          example:
            error: API key mancante o non valida
    BadRequest:
      description: Body o parametri non validi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            timestamp: '2026-09-04T10:00:00Z'
            status: 400
            error: Bad Request
            message: Il parametro da non può essere successivo al parametro a
    InternalServerError:
      description: Errore interno o impossibilità di persistere la modifica
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            timestamp: '2026-09-04T10:00:00Z'
            status: 500
            error: Internal Server Error
            message: Errore interno del server

  schemas:
    SystemConfiguration:
      type: object
      description: |
        Configurazione runtime completa. I valori numerici di temperatura
        devono avere una sola cifra decimale. `fuso_orario` è un identificatore
        IANA; `ora_legale` abilita le regole DST automatiche del fuso. Se
        `override_attivo` è true, `temperatura_override` è obbligatoria; se è false può essere null.
        `override_fine` è opzionale e indica quando termina la forzatura: è un orario civile
        locale (stesso fuso/DST del calendario) e, se presente su `PUT`, deve essere futuro.
        L'alert di consumo è attivo solo se `alert_soglia` e `alert_polling` sono entrambi
        maggiori di zero.
      additionalProperties: false
      required:
        - soglia_attivazione
        - override_attivo
        - temperatura_override
        - intervallo_polling_secondi
        - max_errori_consecutivi
        - retention_log_giorni
        - ntfy_url
        - ntfy_topic
        - debug_mode
        - fuso_orario
        - ora_legale
        - notifiche_errori_abilitate
        - meteo_esterno_url
        - meteo_esterno_latitudine
        - meteo_esterno_longitudine
        - sensore_url
        - relay_url
        - database_path
        - api_keys
        - alert_soglia
        - alert_polling
      properties:
        soglia_attivazione:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.1
          description: Isteresi di attivazione in °C.
          example: 0.3
        override_attivo:
          type: boolean
          description: Abilita l'override manuale del target calendario.
          example: false
        temperatura_override:
          type: number
          format: double
          nullable: true
          multipleOf: 0.1
          description: Target manuale in °C; obbligatorio quando `override_attivo` è true.
          example: 20.5
        override_fine:
          type: string
          format: date-time
          nullable: true
          description: |
            Istante di fine forzatura in orario civile locale (stesso `fuso_orario`/`ora_legale`
            del calendario), formato ISO senza offset (es. `2026-09-13T08:00:00`). Opzionale e
            rilevante solo con `override_attivo` true; se assente la forzatura è a tempo
            indeterminato. Su `PUT` deve essere futuro, altrimenti la richiesta è rifiutata con 400.
            Alla scadenza la forzatura si disattiva automaticamente e viene persistita.
          example: '2026-09-13T08:00:00'
        intervallo_polling_secondi:
          type: integer
          format: int32
          minimum: 1
          description: Intervallo del ciclo di controllo in secondi.
          example: 60
        max_errori_consecutivi:
          type: integer
          format: int32
          minimum: 1
          description: Soglia di errori consecutivi prima della messa in sicurezza.
          example: 3
        retention_log_giorni:
          type: integer
          format: int32
          minimum: 1
          description: Giorni di conservazione dei log.
          example: 30
        ntfy_url:
          type: string
          format: uri
          minLength: 1
          description: URL base del servizio ntfy.
          example: https://ntfy.sh
        ntfy_topic:
          type: string
          minLength: 1
          description: Topic ntfy usato per le notifiche.
          example: sliverd
        debug_mode:
          type: boolean
          description: Abilita le notifiche informative di accensione e spegnimento.
          example: false
        fuso_orario:
          type: string
          minLength: 1
          pattern: '^[A-Za-z0-9._+-]+(?:/[A-Za-z0-9._+-]+)*$'
          description: Identificatore IANA del fuso usato dal calendario.
          default: Europe/Rome
          example: Europe/Rome
        ora_legale:
          type: boolean
          description: Se true applica automaticamente le regole DST del fuso; se false usa l'offset standard.
          default: true
          example: true
        notifiche_errori_abilitate:
          type: boolean
          description: |
            Abilita le notifiche degli errori tramite ntfy. Gli errori di lettura
            meteo esterno (`READ_WEATHER`) non generano notifiche ntfy
            indipendentemente da questo flag: si tratta di un servizio terzo
            informativo e la sua irraggiungibilità non deve produrre rumore.
          default: true
          example: true
        meteo_esterno_url:
          type: string
          format: uri
          minLength: 1
          description: URL base del servizio REST meteo pubblico.
          example: https://api.open-meteo.com
        meteo_esterno_latitudine:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitudine del punto usato per il meteo esterno; default Acireale.
          example: 37.6167
        meteo_esterno_longitudine:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitudine del punto usato per il meteo esterno; default Acireale.
          example: 15.1667
        sensore_url:
          type: string
          format: uri
          minLength: 1
          description: URL base del sensore REST esterno.
          example: http://sensore.local
        relay_url:
          type: string
          format: uri
          minLength: 1
          description: URL base del relay REST esterno.
          example: http://relay.local
        database_path:
          type: string
          minLength: 1
          description: Percorso del database SQLite; bootstrap-only.
          example: ./data/termostato.db
        api_keys:
          type: array
          uniqueItems: true
          description: Elenco delle API-key autorizzate. Lista vuota significa fail-closed.
          items:
            type: string
            minLength: 1
          example:
            - e2e-test-key
        alert_soglia:
          type: number
          format: double
          minimum: 0
          default: 0
          description: |
            Somma della potenza istantanea (in watt) dei dispositivi Shelly che
            effettuano misurazioni (tipi `PM` e `PM_RELAY`) oltre la quale inviare
            l'alert ntfy. L'alert scatta solo se la somma è **strettamente maggiore**
            della soglia e viene reinviato a ogni giro di controllo in cui la somma
            resta sopra soglia.
            L'alert è attivo solo se questo valore è `> 0` **e** `alert_polling` è `> 0`:
            da solo non basta. `0` (o `null`, normalizzato a `0`) disabilita la funzione.
            Su `PUT` va sempre reinviato: se manca viene azzerato senza errore.
          example: 1500.75
        alert_polling:
          type: integer
          format: int32
          minimum: 0
          default: 0
          description: |
            Ogni quanti secondi controllare la somma della potenza dei dispositivi Shelly.
            `0` disabilita la funzione. Su `PUT` va sempre reinviato ed è troncato a intero
            dal backend: `2.5` diventa `2` senza errore, quindi va inviato come intero.
            È indipendente da `intervallo_polling_secondi`, dedicato al ciclo della caldaia.
          example: 30

    CalendarDocument:
      type: object
      description: Calendario settimanale con esattamente i sette giorni canonici.
      additionalProperties: false
      required: [giorni]
      properties:
        giorni:
          type: object
          additionalProperties: false
          required:
            - lunedi
            - martedi
            - mercoledi
            - giovedi
            - venerdi
            - sabato
            - domenica
          properties:
            lunedi:
              $ref: '#/components/schemas/CalendarIntervals'
            martedi:
              $ref: '#/components/schemas/CalendarIntervals'
            mercoledi:
              $ref: '#/components/schemas/CalendarIntervals'
            giovedi:
              $ref: '#/components/schemas/CalendarIntervals'
            venerdi:
              $ref: '#/components/schemas/CalendarIntervals'
            sabato:
              $ref: '#/components/schemas/CalendarIntervals'
            domenica:
              $ref: '#/components/schemas/CalendarIntervals'

    CalendarIntervals:
      type: array
      description: Intervalli ordinati automaticamente per ora di inizio e non sovrapposti.
      items:
        $ref: '#/components/schemas/TimeInterval'

    TimeInterval:
      type: object
      additionalProperties: false
      required:
        - ora_inizio
        - ora_fine
        - temperatura_target
      properties:
        ora_inizio:
          type: string
          description: Ora locale di inizio nel `fuso_orario` configurato, inclusiva. Sono accettati `HH:mm` e `HH:mm:ss`.
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9](?:\.[0-9]{1,9})?)?$'
          example: '06:00'
        ora_fine:
          type: string
          description: Ora locale di fine nel `fuso_orario` configurato, esclusiva; deve essere successiva a `ora_inizio`.
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9](?:\.[0-9]{1,9})?)?$'
          example: '08:00'
        temperatura_target:
          type: number
          format: double
          multipleOf: 0.1
          description: Temperatura target in °C con una cifra decimale.
          example: 20.5

    TemperatureReading:
      type: object
      additionalProperties: false
      required: [temperatura, umidita]
      properties:
        temperatura:
          type: number
          format: double
          description: Temperatura in °C, normalizzata a una cifra decimale.
          example: 19.0
        umidita:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Umidità relativa in percentuale, normalizzata a una cifra decimale.
          example: 50.0

    RelayCommand:
      type: object
      additionalProperties: false
      required: [acceso]
      properties:
        acceso:
          type: boolean
          description: '`true` accende il relay; `false` lo spegne.'
          example: true

    RelayStateResponse:
      type: object
      additionalProperties: false
      required: [acceso]
      properties:
        acceso:
          type: boolean
          description: Stato corrente del relay.
          example: false

    MockStateResponse:
      type: object
      additionalProperties: false
      required:
        - temperatura
        - umidita
        - relay_acceso
      properties:
        temperatura:
          type: number
          format: double
          description: Temperatura corrente del dispositivo simulato in °C.
          example: 19.0
        umidita:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Umidità relativa del dispositivo simulato in percentuale.
          example: 50.0
        relay_acceso:
          type: boolean
          description: Stato corrente del relay simulato.
          example: false

    PollingLogRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - data_ora
        - caldaia_accesa
        - temperatura_rilevata
        - umidita_rilevata
        - temperatura_target
        - override_attivo
        - temperatura_override
        - temperatura_esterna
        - umidita_esterna
      properties:
        id:
          type: integer
          format: int64
          example: 42
        data_ora:
          type: string
          format: date-time
          description: Timestamp del ciclo in UTC.
          example: '2026-09-04T10:00:00.000000000Z'
        caldaia_accesa:
          type: boolean
          example: true
        temperatura_rilevata:
          type: number
          format: double
          example: 19.0
        umidita_rilevata:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Umidità interna rilevata dal sensore in percentuale.
          example: 50.0
        temperatura_target:
          type: number
          format: double
          nullable: true
          description: Target risolto; null quando non è attivo alcun intervallo o override.
          example: 20.5
        override_attivo:
          type: boolean
          example: false
        temperatura_override:
          type: number
          format: double
          nullable: true
          example: null
        temperatura_esterna:
          type: number
          format: double
          nullable: true
          description: Temperatura esterna da Open-Meteo; null se la lettura è fallita.
          example: 24.3
        umidita_esterna:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
          description: Umidità esterna da Open-Meteo; null se la lettura è fallita.
          example: 68.6

    ErrorLogRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - data_ora
        - tipo_errore
        - caldaia_accesa
        - temperatura_rilevata
        - num_errori_consecutivi
      properties:
        id:
          type: integer
          format: int64
          example: 7
        data_ora:
          type: string
          format: date-time
          description: Timestamp dell'errore in UTC.
          example: '2026-09-04T10:00:00.000000000Z'
        tipo_errore:
          type: string
          description: |
            Categoria tecnica dell'errore. Valori possibili:
            `READ_TEMP` (sensore temperatura), `READ_WEATHER` (meteo esterno — non genera ntfy),
            `READ_RELAY` (lettura relay), `TURN_ON` (accensione caldaia),
            `TURN_OFF` (spegnimento caldaia).
          example: READ_TEMP
        caldaia_accesa:
          type: boolean
          nullable: true
          description: Stato della caldaia se disponibile.
          example: false
        temperatura_rilevata:
          type: number
          format: double
          nullable: true
          description: Ultima temperatura disponibile, se presente.
          example: null
        num_errori_consecutivi:
          type: integer
          format: int32
          minimum: 1
          example: 1

    ShellyTipo:
      type: string
      description: |
        Tipo di dispositivo Shelly. `RELAY` = solo relè; `PM` = solo power
        monitor; `PM_RELAY` = relè e power meter (Shelly 1PM).
      enum: [RELAY, PM, PM_RELAY]
      example: RELAY

    ShellyDeviceResponse:
      type: object
      description: Metadati di un dispositivo Shelly, senza stato live.
      additionalProperties: false
      required: [id, nome, ip, tipo, modello, generazione]
      properties:
        id:
          type: string
          description: Identificatore univoco del dispositivo.
          example: portone
        nome:
          type: string
          description: Nome descrittivo del dispositivo.
          example: Portone
        ip:
          type: string
          description: Indirizzo IP del dispositivo nella rete locale.
          example: 192.168.1.2
        tipo:
          $ref: '#/components/schemas/ShellyTipo'
        modello:
          type: string
          description: Codice modello del dispositivo Shelly.
          example: SHSW-1
        generazione:
          type: integer
          format: int32
          description: Generazione hardware del dispositivo (1 o 3).
          enum: [1, 3]
          example: 1

    ShellyRelayStatoResponse:
      type: object
      description: Stato corrente di un relay Shelly con metadati del dispositivo.
      additionalProperties: false
      required: [id, nome, ip, modello, generazione, tipo, acceso]
      properties:
        id:
          type: string
          example: portone
        nome:
          type: string
          example: Portone
        ip:
          type: string
          example: 192.168.1.2
        modello:
          type: string
          example: SHSW-1
        generazione:
          type: integer
          format: int32
          enum: [1, 3]
          example: 1
        tipo:
          $ref: '#/components/schemas/ShellyTipo'
        acceso:
          type: boolean
          description: Stato corrente del relay, letto direttamente dal dispositivo.
          example: false
        esito:
          type: boolean
          nullable: true
          description: |
            Esito esplicito del comando: `true` se il dispositivo ha confermato
            l'esecuzione (risposta `Switch.Set` ricevuta). Presente solo nelle
            risposte a `POST /shelly/relay/{id}/on|off`; `null` su
            `GET /shelly/relay/{id}`.
          example: true
        stato_precedente:
          type: boolean
          nullable: true
          description: |
            Stato del relay prima del comando (equivalente di `was_on` della API
            RPC Shelly). Valorizzato per i dispositivi Gen 3 (es. `terrazzo`);
            `null` per i Gen 1 (es. `portone`) e su `GET /shelly/relay/{id}`.
          example: false

    ShellyStatoResponse:
      type: object
      description: |
        Stato in tempo reale di un dispositivo Shelly con i suoi metadati.
        I campi sono sempre presenti; quelli non applicabili al tipo del
        dispositivo valgono `null`.
      additionalProperties: false
      required: [id, nome, ip, modello, generazione, tipo, acceso, potenza_w, tensione_v, corrente_a]
      properties:
        id:
          type: string
          example: shelly1pm
        nome:
          type: string
          example: Shelly 1PM
        ip:
          type: string
          example: 192.168.1.20
        modello:
          type: string
          example: SHSW-PM
        generazione:
          type: integer
          format: int32
          enum: [1, 3]
          example: 1
        tipo:
          $ref: '#/components/schemas/ShellyTipo'
        acceso:
          type: boolean
          nullable: true
          description: |
            Stato del relè letto dal dispositivo; `null` per i tipi senza
            relè (`PM`).
          example: true
        potenza_w:
          type: number
          format: double
          nullable: true
          description: |
            Potenza istantanea in Watt; `null` per i tipi senza power meter
            (`RELAY`) o quando la misura non è disponibile.
          example: 45.2
        tensione_v:
          type: number
          format: double
          nullable: true
          description: Tensione in Volt; `null` se non applicabile o non letta.
          example: 229.8
        corrente_a:
          type: number
          format: double
          nullable: true
          description: Corrente in Ampere; `null` se non applicabile o non letta.
          example: 0.197

    ApiError:
      type: object
      additionalProperties: false
      required: [timestamp, status, error, message]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Istante UTC della risposta di errore.
        status:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Payload non valido

    UnauthorizedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          example: API key mancante o non valida

    ActuatorHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Stato aggregato dell'applicazione.
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
          example: UP
      additionalProperties: true

    ActuatorMetricNames:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items:
            type: string
          example: [jvm.memory.used, process.uptime]

    ActuatorMetric:
      type: object
      required: [name, measurements]
      properties:
        name:
          type: string
          example: process.uptime
        description:
          type: string
          nullable: true
          example: The uptime of the Java Virtual Machine
        baseUnit:
          type: string
          nullable: true
          example: seconds
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/ActuatorMeasurement'
        availableTags:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    ActuatorMeasurement:
      type: object
      required: [statistic, value]
      properties:
        statistic:
          type: string
          example: VALUE
        value:
          type: number
          format: double
          example: 123.45
